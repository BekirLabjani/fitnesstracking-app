<!-- BACKDROP -->
<div class="profile-page" *ngIf="open" (click)="close.emit()"></div>

<!-- SHEET -->
<div class="sheet" [class.open]="open" (click)="$event.stopPropagation()">

  <button class="sheet-close" (click)="close.emit()">✕</button>

  <div class="profile-header">
    <div class="avatar-section">

      <input #fileInput type="file" accept="image/*" hidden (change)="onFileSelected($event)" />

      <div class="avatar" (click)="onAvatarClick(fileInput)">
        <img *ngIf="photoUrl && !uploading" [src]="photoUrl" alt="Profilbild" />
        <div *ngIf="!photoUrl && !uploading" class="avatar-initials">
          {{ displayName.slice(0, 2).toUpperCase() }}
        </div>
        <div *ngIf="uploading" class="avatar-uploading">⏳</div>
      </div>

      <button class="edit-btn" (click)="onAvatarClick(fileInput)">✎</button>
    </div>

    <div class="user-info">
      <h2>{{ displayName }}</h2>
      <p class="upload-error" *ngIf="uploadError">{{ uploadError }}</p>
      <p class="upload-hint" *ngIf="!uploading && !uploadError">Foto tippen zum Ändern</p>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat">
      <strong>–</strong>
      <span>Current Weight</span>
    </div>
  </div>

  <app-navbar></app-navbar>

  <button class="logout-btn" (click)="onLogout()">
    <span class="logout-icon">🚪</span>
    Abmelden
  </button>
</div>
