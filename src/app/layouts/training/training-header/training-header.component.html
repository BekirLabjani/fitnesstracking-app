<header class="training-topbar">
  <span class="topbar-title">Training</span>
  <button class="menu-btn" (click)="toggleDrawer()" aria-label="Menü öffnen">
    <svg viewBox="0 -960 960 960" width="24px" height="24px" fill="currentColor">
      <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/>
    </svg>
  </button>
</header>

<!-- Backdrop -->
<div class="drawer-backdrop" *ngIf="isDrawerOpen" (click)="closeDrawer()"></div>

<!-- Navigations-Drawer -->
<nav class="drawer" [class.open]="isDrawerOpen">

  <div class="drawer-profile" routerLink="/profile" (click)="closeDrawer()">
    <div class="drawer-avatar">
      <img *ngIf="photoUrl" [src]="photoUrl" alt="Avatar" />
      <span *ngIf="!photoUrl">{{ initials }}</span>
    </div>
    <div class="drawer-profile-info">
      <span class="drawer-name">{{ displayName }}</span>
      <span class="drawer-profile-link">Profil ansehen →</span>
    </div>
  </div>

  <button class="drawer-close" (click)="closeDrawer()" aria-label="Menü schließen">✕</button>

  <ul class="drawer-links">
    <li>
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeDrawer()">
        <span class="nav-icon">🏠</span>
        <span>Dashboard</span>
      </a>
    </li>
    <li>
      <a routerLink="/training" routerLinkActive="active" (click)="closeDrawer()">
        <span class="nav-icon">💪</span>
        <span>Training</span>
      </a>
    </li>
    <li>
      <a routerLink="/trainingsplan" routerLinkActive="active" (click)="closeDrawer()">
        <span class="nav-icon">📋</span>
        <span>Trainingsplan</span>
      </a>
    </li>
    <li>
      <a routerLink="/profile" routerLinkActive="active" (click)="closeDrawer()">
        <span class="nav-icon">👤</span>
        <span>Profil</span>
      </a>
    </li>
    <li>
      <a routerLink="/settings" routerLinkActive="active" (click)="closeDrawer()">
        <span class="nav-icon">⚙️</span>
        <span>Einstellungen</span>
      </a>
    </li>
  </ul>

  <a class="drawer-upgrade" routerLink="/upgrade" (click)="closeDrawer()" *ngIf="!(premium.isPremium$ | async)">
    <span class="nav-icon">⭐</span>
    <span>Premium freischalten</span>
  </a>
</nav>
