<header>
  <button class="menu-btn" (click)="toggleDrawer()" aria-label="Menü öffnen">
    <svg xmlns="http://www.w3.org/2000/svg" height="30px" viewBox="0 -960 960 960" width="30px" fill="#F3F3F3">
      <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/>
    </svg>
  </button>
</header>

<!-- Backdrop -->
<div class="drawer-backdrop" *ngIf="isDrawerOpen" (click)="closeDrawer()"></div>

<!-- Navigations-Drawer -->
<nav class="drawer" [class.open]="isDrawerOpen">
  <div class="drawer-header">
    <span class="drawer-title">Navigation</span>
    <button class="drawer-close" (click)="closeDrawer()">✕</button>
  </div>

  <ul class="drawer-links">
    <li>
      <a routerLink="/dashboard" routerLinkActive="active" (click)="closeDrawer()">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </a>
    </li>
    <li>
      <a routerLink="/training" routerLinkActive="active" (click)="closeDrawer()">
        <span class="nav-icon">💪</span>
        <span>Training</span>
      </a>
    </li>
    <li>
      <a routerLink="/profile" routerLinkActive="active" (click)="closeDrawer()">
        <span class="nav-icon">👤</span>
        <span>Profil</span>
      </a>
    </li>
    <li>
      <a routerLink="/dashboard" routerLinkActive="active" (click)="closeDrawer()">
        <span class="nav-icon">📊</span>
        <span>Dashboard</span>
      </a>
    </li>
  </ul>
</nav>
